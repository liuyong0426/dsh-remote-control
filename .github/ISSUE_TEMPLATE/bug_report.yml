name: 问题报告
description: 插件哪里不工作了、或行为和说明不一致
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢花时间写下来～ 提交前先扫一眼 [README](https://github.com/liuyong0426/dsh-remote-control#连接不上时) 的「连接不上时」和 [SUPPORT.md](https://github.com/liuyong0426/dsh-remote-control/blob/main/SUPPORT.md)，也许能马上解决。
        **安全漏洞请不要用这个模板**，走 [SECURITY.md](https://github.com/liuyong0426/dsh-remote-control/blob/main/SECURITY.md)。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / 期望是什么
      description: 一句话说清现象，再说你以为应该怎样。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪里点起、点了什么、到第几步出问题。
      placeholder: |
        1. 设置 → 远程控制 → 选「任意网络」→ 开启
        2. 手机扫码后在电脑上允许
        3. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: DSH 版本 / Node 版本 / 系统 / 桌面版还是 dsh web / 手机浏览器
      placeholder: "DSH 0.2.2-rc.1 · Node 24.1.0 · Windows 11 · 桌面版 · iOS Safari 18"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 连接方式
      options:
        - 同一 Wi‑Fi
        - 任意网络（Cloudflare）
        - 任意网络（localhost.run）
        - 还没到这一步 / 不确定
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错文字或截图
      description: 贴文字最好。截图请**先遮掉二维码、临时公网地址、token、设备密钥**，`.qa/` 里的东西别贴。
    validations:
      required: false
  - type: checkboxes
    id: check
    attributes:
      label: 提交前确认
      options:
        - label: 我已经检查过截图／日志里没有二维码、token 或凭据
          required: true
        - label: 我搜过现有 issue，没有重复
          required: false