name: 功能建议
description: 想让它多会一点什么
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 想法不分大小都欢迎。如果这个改动涉及配对、授权或公网连接，请顺带说一句你考虑到的安全影响。
  - type: textarea
    id: problem
    attributes:
      label: 现在哪里不顺手
      description: 先说场景，不用说解法。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望变成什么样
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 试过别的办法吗
    validations:
      required: false
  - type: checkboxes
    id: contrib
    attributes:
      label: 参与
      options:
        - label: 我愿意试着提个 PR（不保证，也没关系）
          required: false